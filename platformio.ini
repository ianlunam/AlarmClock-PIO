; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Without this, a plain `pio run` (or `-t upload`) builds every environment
; below, including esp32dev_ota - which redundantly re-fetches every library
; into its own separate build folder just to build the exact same firmware.
; That's slow and, as observed, occasionally flaky (a transient mirror 403
; failed the whole command even though esp32dev itself had already built
; fine). Explicitly pick esp32dev_ota with -e when you want an OTA upload.
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  ESP32Async/ESPAsyncWebServer
  bodmer/TFT_eSPI
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
  lvgl/lvgl@^9.2.2
  knolleary/PubSubClient@^2.8
  bodmer/TFT_eWidget@^0.0.6
build_flags =
	-D USER_SETUP_LOADED
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D USE_HSPI_PORT
	-D TFT_DC=2
	-D TFT_RST=-1
	-D TFT_BL=21
	-D TFT_BACKLIGHT_ON=HIGH
	-D TOUCH_CS=33
	-D SPI_FREQUENCY=55000000
	-D SPI_READ_FREQUENCY=20000000
	-D SPI_TOUCH_FREQUENCY=2500000
	-D XPT2046_IRQ=36
	-D XPT2046_MOSI=32
	-D XPT2046_MISO=39
	-D XPT2046_CLK=25
	-D XPT2046_CS=33
	-D LDR_PIN=34
	-D LDR_DARK_THRESHOLD=0
	-D LDR_LIGHT_THRESHOLD=20
	-D LDR_DEBOUNCE_COUNT=5
	-D LED_BLUE=17
	-D LED_RED=4
	-D LED_GREEN=16
	-D LOAD_GLCD
	-D LOAD_FONT2
	-D LOAD_FONT4
	-D LOAD_FONT6
	-D LOAD_FONT7
	-D LOAD_FONT8
	-D LOAD_GFXFF
	-D SMOOTH_FONT=0
	-D ILI9341_2_DRIVER
	-D BL_MAX=150
	-D BL_MIN=1
	-D SPEAKER_PIN=26
	-D SPEAKER_CHANNEL=0
	-D TEXT_R=1
	-D TEXT_G=17
	-D TEXT_B=9
	-D MQTT_BROKER=\"homeassistant.local\"
	-D MQTT_PORT=1883
	-D BACKGROUND_COLOUR=TFT_BLACK
	-D TIMEZONE=\"NZST-12NZDT,M9.5.0,M4.1.0/3\"
	-D NTP_SERVER=\"nz.pool.ntp.org\"
	!echo "'-D WIFI_SSID=\"$(grep WIFI_SSID ../.secrets | awk '{print $2}')\"'"
	!echo "'-D WIFI_PWD=\"$(grep WIFI_PWD ../.secrets | awk '{print $2}')\"'"
	!echo "'-D MQTT_USER=\"$(grep MQTT_USER ../.secrets | awk '{print $2}')\"'"
	!echo "'-D MQTT_PWD=\"$(grep MQTT_PWD ../.secrets | awk '{print $2}')\"'"

; Uploads over WiFi instead of USB, once the device is already running
; firmware with OTA enabled (i.e. not for the very first flash).
; Use with: pio run -e esp32dev_ota -t upload
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = newalarmclock.local

; Runs pure-logic unit tests on this machine (no ESP32/hardware involved),
; via `pio test -e native`. Only files with zero Arduino/hardware
; dependencies can go in build_src_filter below - see test/README.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*> +<AlarmLogic.cpp> +<LdrHysteresis.cpp>
